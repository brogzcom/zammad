x-shared:
  zammad-service: &a1
    environment:
      MEMCACHE_SERVERS: ${MEMCACHE_SERVERS:-zammad-memcached:11211}
      POSTGRESQL_DB: ${POSTGRES_DB:-zammad_production}
      POSTGRESQL_HOST: ${POSTGRES_HOST:-zammad-postgresql}
      POSTGRESQL_USER: ${POSTGRES_USER:-zammad}
      POSTGRESQL_PASS: ${POSTGRES_PASS:-zammad}
      POSTGRESQL_PORT: ${POSTGRES_PORT:-5432}
      POSTGRESQL_OPTIONS: ${POSTGRESQL_OPTIONS:-?pool=50}
      POSTGRESQL_DB_CREATE: ${POSTGRESQL_DB_CREATE:-false}
      REDIS_URL: ${REDIS_URL:-redis://zammad-redis:6379}
      BACKUP_DIR: ${BACKUP_DIR:-/var/tmp/zammad}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      HOLD_DAYS: ${HOLD_DAYS:-10}
      TZ: ${TZ:-America/Bogota}
    image: ${IMAGE_REPO:-ghcr.io/zammad/zammad}:${VERSION:-7.2.0-0011}
    volumes:
      - zammad-backup:/var/tmp/zammad:ro
      - zammad-storage:/opt/zammad/storage
    # Swarm no soporta depends_on con condiciones ni "restart":
    # se reintenta solo hasta que PostgreSQL, Redis y Memcached estén listos.
    deploy:
      restart_policy:
        condition: any
        delay: 10s
services:
  zammad-backup:
    <<: *a1
    command:
      - zammad-backup
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage
    user: 0:0
  zammad-elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-9.5.3}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    deploy:
      restart_policy:
        condition: any
        delay: 10s
  zammad-init:
    <<: *a1
    command:
      - zammad-init
    user: 0:0
    # Tarea de una sola ejecución: solo reintenta si falla.
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
  zammad-memcached:
    command: memcached -m 256M
    image: memcached:${MEMCACHE_VERSION:-1.6.45-alpine}
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "11211"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
  zammad-nginx:
    <<: *a1
    command:
      - zammad-nginx
    expose:
      - ${NGINX_PORT:-8080}
    ports:
      - ${NGINX_EXPOSE_PORT:-8080}:${NGINX_PORT:-8080}
  zammad-postgresql:
    command: postgres ${POSTGRES_MAX_CONNECTIONS:+-c max_connections=${POSTGRES_MAX_CONNECTIONS}} ${POSTGRES_SHARED_BUFFERS:+-c shared_buffers=${POSTGRES_SHARED_BUFFERS}} ${POSTGRES_TEMP_BUFFERS:+-c temp_buffers=${POSTGRES_TEMP_BUFFERS}} ${POSTGRES_WORK_MEM:+-c work_mem=${POSTGRES_WORK_MEM}} ${POSTGRES_MAX_STACK_DEPTH:+-c max_stack_depth=${POSTGRES_MAX_STACK_DEPTH}} ${POSTGRES_EXTRA_OPTS:-}
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASS:-${POSTGRES_PASS:-zammad}}
      ZAMMAD_DB: ${POSTGRES_DB:-zammad_production}
      ZAMMAD_DB_USER: ${POSTGRES_USER:-zammad}
      ZAMMAD_DB_PASS: ${POSTGRES_PASS:-zammad}
    image: postgres:${POSTGRES_VERSION:-17.11-alpine}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    configs:
      - source: postgresql-initdb
        target: /docker-entrypoint-initdb.d/10-create-zammad-role.sh
        mode: 0555
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          PGPASSWORD="$${ZAMMAD_DB_PASS}" \
          psql --no-password --quiet --output /dev/null --variable ON_ERROR_STOP=1 \
               --host 127.0.0.1 --username "$${ZAMMAD_DB_USER}" \
               --dbname "$${ZAMMAD_DB}" --command "SELECT 1"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 10s
  zammad-railsserver:
    <<: *a1
    command:
      - zammad-railsserver
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:${ZAMMAD_RAILSSERVER_PORT:-3000}
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
  zammad-redis:
    image: redis:${REDIS_VERSION:-8.10.2-alpine}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 10s
  zammad-scheduler:
    <<: *a1
    command:
      - zammad-scheduler
  zammad-websocket:
    <<: *a1
    command:
      - zammad-websocket
configs:
  postgresql-initdb:
    content: |
      #!/bin/bash

      set -o errexit
      set -o pipefail

      # initdb has already run by the time this hook does, so a rejected configuration
      #   cannot be repaired by correcting it and starting again: the data directory is
      #   populated and the entrypoint never processes this directory a second time.
      #   Say so, rather than leaving the operator with a role or database that is
      #   merely reported missing later on.
      zammad_abort() {
        echo "$$1" >&2
        echo "Correct this, then remove the postgresql-data volume and start again. The" >&2
        echo "  database directory is already initialised, so this will not run twice." >&2
        exit 1
      }

      # Zammad must not reuse the bootstrap role, which is always a superuser. This
      #   cannot be enforced on later starts: the only reliable signal is this
      #   comparison, and checking the role's actual attributes instead would mark
      #   every installation predating this change as unhealthy.
      if [ "$${ZAMMAD_DB_USER}" = "$${POSTGRES_USER}" ]; then
        zammad_abort "POSTGRES_USER and POSTGRES_SUPERUSER must differ, the latter is a superuser."
      fi

      # The system databases exist already, so they would keep the bootstrap role as
      #   their owner, and Zammad would run inside a database it does not own.
      case "$${ZAMMAD_DB}" in
        postgres | template0 | template1)
          zammad_abort "POSTGRES_DB must not be one of PostgreSQL's system databases."
          ;;
      esac

      echo "Creating the '$${ZAMMAD_DB_USER}' role and the '$${ZAMMAD_DB}' database…"

      # The identifiers and the password are passed as psql variables, so that psql
      #   quotes them and no shell quoting can leak into the statements. The role owns
      #   the database, which already carries every privilege it needs on it.
      psql --variable ON_ERROR_STOP=1 \
           --username "$${POSTGRES_USER}" \
           --dbname "$${POSTGRES_DB}" \
           --variable role="$${ZAMMAD_DB_USER}" \
           --variable pass="$${ZAMMAD_DB_PASS}" \
           --variable db="$${ZAMMAD_DB}" <<'EOSQL'
      CREATE ROLE :"role" LOGIN PASSWORD :'pass';
      CREATE DATABASE :"db" OWNER :"role";
      EOSQL
volumes:
  elasticsearch-data:
    driver: local
  postgresql-data:
    driver: local
  redis-data:
    driver: local
  zammad-backup:
    driver: local
  zammad-storage:
    driver: local