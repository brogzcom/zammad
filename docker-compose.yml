x-shared:
  zammad-service: &a1
    environment:
      MEMCACHE_SERVERS: ${MEMCACHE_SERVERS:-zammad-memcached:11211}
      POSTGRESQL_DB: ${POSTGRES_DB:-zammad_production}
      POSTGRESQL_HOST: ${POSTGRES_HOST:-zammad-postgresql}
      POSTGRESQL_USER: ${POSTGRES_USER:-zammad}
      POSTGRESQL_PASS: ${POSTGRES_PASS:-zammad}
      POSTGRESQL_PORT: ${POSTGRES_PORT:-5432}
      POSTGRESQL_OPTIONS: ${POSTGRESQL_OPTIONS:-?pool=50}
      POSTGRESQL_DB_CREATE: ${POSTGRESQL_DB_CREATE:-false}
      REDIS_URL: ${REDIS_URL:-redis://zammad-redis:6379}
      BACKUP_DIR: ${BACKUP_DIR:-/var/tmp/zammad}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      HOLD_DAYS: ${HOLD_DAYS:-10}
      TZ: ${TZ:-America/Bogota}
    image: ${IMAGE_REPO:-ghcr.io/zammad/zammad}:${VERSION:-7.2.0-0011}
    volumes:
      - zammad-backup:/var/tmp/zammad:ro
      - zammad-storage:/opt/zammad/storage
    # Swarm no soporta depends_on con condiciones ni "restart":
    # se reintenta solo hasta que PostgreSQL, Redis y Memcached estén listos.
    deploy:
      restart_policy:
        condition: any
        delay: 10s
services:
  zammad-backup:
    <<: *a1
    command:
      - zammad-backup
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage
    user: 0:0
  zammad-elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-9.5.3}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    deploy:
      restart_policy:
        condition: any
        delay: 10s
  zammad-init:
    <<: *a1
    command:
      - zammad-init
    user: 0:0
    # Tarea de una sola ejecución: solo reintenta si falla.
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
  zammad-memcached:
    command: memcached -m 256M
    image: memcached:${MEMCACHE_VERSION:-1.6.45-alpine}
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "11211"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
  zammad-nginx:
    <<: *a1
    command:
      - zammad-nginx
    expose:
      - ${NGINX_PORT:-8080}
    networks:
      - default
      - dokploy-network
    deploy:
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - traefik.docker.network=dokploy-network
        - traefik.swarm.network=dokploy-network
  zammad-postgresql:
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zammad}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-zammad}
      POSTGRES_DB: ${POSTGRES_DB:-zammad_production}
    image: postgres:${POSTGRES_VERSION:-17.11-alpine}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          PGPASSWORD="$${POSTGRES_PASSWORD}" \
          psql --no-password --quiet --output /dev/null --variable ON_ERROR_STOP=1 \
               --host 127.0.0.1 --username "$${POSTGRES_USER}" \
               --dbname "$${POSTGRES_DB}" --command "SELECT 1"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 10s
  zammad-railsserver:
    <<: *a1
    command:
      - zammad-railsserver
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:${ZAMMAD_RAILSSERVER_PORT:-3000}
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
  zammad-redis:
    image: redis:${REDIS_VERSION:-8.10.2-alpine}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 10s
  zammad-scheduler:
    <<: *a1
    command:
      - zammad-scheduler
  zammad-websocket:
    <<: *a1
    command:
      - zammad-websocket
volumes:
  elasticsearch-data:
    driver: local
  postgresql-data:
    driver: local
  redis-data:
    driver: local
  zammad-backup:
    driver: local
  zammad-storage:
    driver: local
networks:
  dokploy-network:
    external: true